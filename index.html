<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e2126" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Guía de estudio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-180.png">
<link rel="stylesheet" href="estilos.css">
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
    processEnvironments: true,
    macros: {
      E: '\\operatorname{E}',
      Var: '\\operatorname{Var}',
      Cov: '\\operatorname{Cov}',
      Pr: '\\operatorname{Pr}',
      dto: '\\xrightarrow{\\ d\\ }',
      pto: '\\xrightarrow{\\ p\\ }',
      cseg: '\\xrightarrow{\\text{c.s.}}',
      ub: ['\\underline{#1}', 1]
    }
  },
  svg: { fontCache: 'global', scale: 0.94 },
  startup: { typeset: false }
};
</script>
<script src="vendor/mathjax-tex-svg.js"></script>
<script src="datos.js"></script>
</head>
<body>

<div id="candado" hidden>
  <form id="formaClave" class="candado-caja" autocomplete="off">
    <h1>Guía de estudio</h1>
    <p>El contenido está cifrado. Escribe la contraseña para abrirlo.</p>
    <input type="text" name="username" autocomplete="username" value="guia-de-estudio" hidden>
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <label class="casilla"><input id="recordar" type="checkbox"> Recordar en este dispositivo</label>
    <button type="submit" class="primario">Abrir</button>
    <p id="errorClave" class="error" role="alert" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="barra">
    <button id="botonMenu" class="icono" aria-label="Mostrar u ocultar el menú" aria-expanded="false">☰</button>
    <a class="marca" href="#/">Guía de estudio</a>
    <input id="buscar" type="search" placeholder="Buscar en el contenido" aria-label="Buscar en el contenido">
    <button id="botonTema" class="icono" aria-label="Cambiar entre tema claro y oscuro">◐</button>
  </header>
  <div class="cuerpo">
    <nav id="menu" aria-label="Exámenes y problemas"></nav>
    <main id="vista" tabindex="-1"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
